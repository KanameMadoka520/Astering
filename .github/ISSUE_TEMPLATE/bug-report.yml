name: Astering bug report
description: Found something you weren't expecting? Report it here!
body:
  - type: markdown
    attributes:
      value: |
        For security concerns, read the [Astering security policy](https://github.com/KanameMadoka520/Astering/security/policy) first. Do not post credentials or private data.
  - type: markdown
    attributes:
      value: |
        Please fill out this issue template to report a bug.
        
        1. Feature requests, questions and deployment problems can use a blank issue in this repository.
        2. Report this fork's issues here; upstream community services do not support Astering-specific changes.
        3. Make sure you are using the latest release and
           take a moment to check that your issue hasn't been reported before.
        4. Please give all relevant information below for bug reports, because
           incomplete details will be handled as an invalid report and closed.
  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched for existing open or closed issue reports with the same problem.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the problem and reproduction steps. Share only non-sensitive URLs and redact account names, tokens and private content.
  - type: input
    id: version
    attributes:
      label: Astering version
      description: Astering version (or commit reference) of your instance
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and version
      description: If your issue is related to a frontend problem, please provide the browser and version you used to reproduce it.
  - type: dropdown
    id: can-reproduce
    attributes:
      label: Can you reproduce the bug on your Astering instance?
      options:
        - "Please select"
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If this issue involves the web interface, provide redacted screenshots without private content.
