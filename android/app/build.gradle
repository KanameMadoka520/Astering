plugins {
    id 'com.android.application'
}

def signingFile = System.getenv('ASTERING_ANDROID_KEYSTORE')
def signingPassword = System.getenv('ASTERING_ANDROID_STORE_PASSWORD')
def signingAlias = System.getenv('ASTERING_ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ASTERING_ANDROID_KEY_PASSWORD')

android {
    namespace 'space.tcymc.astering'
    compileSdk 36

    defaultConfig {
        applicationId 'space.tcymc.astering'
        minSdk 26
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
        versionCode 69
        versionName '2.7.1-aster.69'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    // Only the runtime, tiny VAD and notices ship in the APK. Recognizer weights are opt-in downloads.
    sourceSets.main.assets.srcDirs += ['../.offline/runtime-assets']
    androidResources { noCompress += ['onnx'] }

    signingConfigs {
        release {
            if (signingFile && signingPassword && signingAlias && signingKeyPassword) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
    buildFeatures {
        buildConfig true
    }
}

tasks.matching { it.name == 'validateSigningRelease' }.configureEach {
    doFirst {
        if (!signingFile || !signingPassword || !signingAlias || !signingKeyPassword) {
            throw new GradleException('Release signing requires the four ASTERING_ANDROID signing environment variables.')
        }
    }
}

dependencies {
    implementation files('../.offline/sherpa-onnx.aar')
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

// Runtime is mandatory; speech weights come from the pinned, verified in-app catalogue.
tasks.named('preBuild').configure {
    doFirst {
        def required = [
            '../.offline/sherpa-onnx.aar': '07e042d97f3a6bd5b7fe74d4eef0513dc01a714b16c15a903250095aba43a575',
            '../.offline/runtime-assets/offline-asr/silero_vad.onnx': '9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6'
        ]
        required.each { name, expected ->
            def artifact = file(name)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            if (!artifact.isFile()) throw new GradleException('Run python3 android/scripts/prepare-offline-asr.py before building. Verified runtime assets are required.')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[1048576]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != expected) throw new GradleException('Offline ASR runtime checksum mismatch; prepare verified assets again.')
        }
    }
}
