description:
  en:
    shortDescription: 'Self-hosted projects, schedules, records and native AI assistance, based on Vikunja.'
    longDescription: >-
      Astering combines task and project views, a calendar, recurring routines,
      personal files, long-term records and Arona, an assistant with explicit
      permissions and reviewable tool operations. It preserves the upstream
      Vikunja copyright and AGPL license. Builds and releases are produced locally.
    documentation: 'https://github.com/KanameMadoka520/Astering/blob/main/README.md'
    features:
      - Project and task management
      - Calendar and CalDAV
      - Kanban and Gantt views
      - Personal records and reusable attachments
      - Permission-scoped native AI tools
  zh-CN:
    shortDescription: '基于 Vikunja 的自托管项目、日程、记录与原生 AI 助手。'
    longDescription: >-
      Astering 将真实任务、日历、周期打卡、个人网盘和星图记录连接起来，
      由具有明确权限与审核边界的阿罗娜辅助执行。保留上游 Vikunja
      版权及 AGPL 许可证，本机测试、编译并手工发布。
    documentation: 'https://github.com/KanameMadoka520/Astering/blob/main/README.md'
    features:
      - 项目与任务管理
      - 日历与 CalDAV
      - 看板与甘特图
      - 长期记录与附件复用
      - 受权限约束的 AI 工具
