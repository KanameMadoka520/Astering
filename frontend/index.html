<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Astering</title>
	<meta name="description" content="Astering — Your personal workspace for projects, plans and an AI companion.">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6"/>
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1119"/>
	<script>
		// Apply the last resolved colour scheme before the bundle loads (written by App.vue).
		try {
			var scheme = localStorage.getItem('vikunja-color-scheme')
			if (scheme === 'dark' || scheme === 'light') document.documentElement.classList.add(scheme)
		} catch (e) { /* storage unavailable */ }
	</script>

	<link rel="icon" href="/favicon.ico?v=aster52">
	<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon-180x180.png?v=aster52"/>
	<link rel="mask-icon" href="/images/brand/logo-mono.svg?v=aster52" color="#191919">
	<!--__vite-plugin-inject-preload__-->
</head>
<body>
<noscript>
	<strong>We're sorry but Astering doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
<script>
	//
	// This variable points the frontend to the api.
	// Leave it empty when the api is served from the same origin as the frontend. Otherwise set it to the
	// url the api is reachable at, including the port and any sub path but without the /api/v2 part.
	window.API_URL = ''
</script>
</body>
</html>
