name: "astering"
arch: "<arch>"
platform: "linux"
version: "<version>"
description: "Astering provides projects, schedules, records and native AI assistance, based on Vikunja."
maintainer: "KanameMadoka520 <90090108+KanameMadoka520@users.noreply.github.com>"
homepage: "https://github.com/KanameMadoka520/Astering"
section: "default"
priority: "extra"
license: "AGPL-3.0-or-later"
depends:
  - systemd
rpm:
  signature:
    key_file: ${NFPM_GPG_KEY_FILE}
# apk and archlinux run `scripts.postinstall` on a fresh install only — nfpm
# maps their upgrade hooks from these packager-specific keys instead. Without
# them, upgrading on Alpine or Arch runs no maintainer script at all.
apk:
  scripts:
    postupgrade: ./build/after-install-openrc.sh
archlinux:
  scripts:
    postupgrade: ./build/after-install.sh
overrides:
  apk:
    depends:
      - openrc
    scripts:
      postinstall: ./build/after-install-openrc.sh
contents:
  - src: <binlocation>
    dst: /opt/astering/astering
  - src: ./config.yml.sample
    dst: /etc/astering/config.yml
    # noreplace only affects rpm; the other packagers treat it as plain config.
    type: "config|noreplace"
  - src: /opt/astering/astering
    dst: /usr/local/bin/astering
    type: "symlink"
  - src: astering.service
    dst: /usr/lib/systemd/system/astering.service
  - src: astering.initd
    dst: /etc/init.d/astering
    file_info:
      mode: 0755
    type: "config"
    packager: apk
scripts:
  postinstall: ./build/after-install.sh
